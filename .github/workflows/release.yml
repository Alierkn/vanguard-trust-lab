name: Build and attest source release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Validate, package, and attest
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Validate release ref and source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run ci
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "${GITHUB_REF_NAME}" = "v$(tr -d '\n' < VERSION)"
          fi

      - name: Build immutable source bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-manual-${GITHUB_SHA::12}}"
          ARCHIVE="vanguard-trust-lab-${VERSION}.zip"
          git archive --format=zip --prefix="vanguard-trust-lab-${VERSION}/" --output="dist/${ARCHIVE}" HEAD
          (cd dist && sha256sum "${ARCHIVE}" > CHECKSUMS.sha256 && sha256sum -c CHECKSUMS.sha256)

      - name: Attest source bundle and checksum
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            dist/*.zip
            dist/CHECKSUMS.sha256

      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-release-${{ github.ref_name || github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
